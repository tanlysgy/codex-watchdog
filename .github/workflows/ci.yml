name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Watchdog tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile watchdog.py
        run: python -m py_compile watchdog.py watchdog_protocol.py watchdog_test.py adapters/base.py adapters/codex.py adapters/claude.py
      - name: Run regression tests
        run: python watchdog_test.py
      - name: Run adapter tests
        run: python adapters_test.py
